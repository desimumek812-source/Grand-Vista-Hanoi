<!-- ===== FORMULIR PEMESANAN ===== -->
      <section id="pesan">
        <h2>Booking Kamar</h2>
        <form action="#" method="post">
          <fieldset>
            <legend>Data Pengunjung</legend>

            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" required />

            <label for="kamar">jenis kamar</label>
            <input id="kamar" name="nama" required />

            <label for="tgl">Tanggal Kunjungan</label>
            <input type="date" id="tgl" name="tgl" />

            <label for="jml">Jumlah Orang</label>
            <input type="number" id="jml" name="jml" min="1" max="20" />

            <label for="paket">Paket</label>
            <select id="kamar" name="nama">
              <option>kamar standard</option>
              <option>kamar Deluxe</option>
              <option>kamar Suite</option>
            </select>

            <label for="catatan">Catatan</label>
            <textarea id="catatan" name="catatan" rows="3"></textarea>

            <button type="submit">Kirim Pesanan</button>
          </fieldset>
        </form>
      </section>
    </main>
